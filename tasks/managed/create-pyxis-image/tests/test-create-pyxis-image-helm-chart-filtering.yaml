---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-create-pyxis-image-helm-chart-filtering
spec:
  description: |
    Run the create-pyxis-image task with both a container image and a helm chart.
    This test ensures that helm charts are filtered out and only container images
    are included in the pyxis output.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils:a58dc96cb28b54cdef2564a346d43a6d7bd4d656
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)"/snapshot.json << EOF
              {
                "application": "myapp",
                "components": [
                  {
                    "name": "container-app-1",
                    "containerImage": "registry.io/container-app-1@sha256:containerdigest1",
                    "repository": "registry.io/container-app-1",
                    "tags": [
                      "container-tag-1"
                    ]
                  },
                  {
                    "name": "helm-chart-1",
                    "containerImage": "registry.io/helm-chart-1@sha256:helmdigest1",
                    "repository": "registry.io/helm-chart-1",
                    "tags": [
                      "helm-tag-1"
                    ]
                  },
                  {
                    "name": "container-app-2",
                    "containerImage": "registry.io/container-app-2@sha256:containerdigest2",
                    "repository": "registry.io/container-app-2",
                    "tags": [
                      "container-tag-2"
                    ]
                  },
                  {
                    "name": "helm-chart-2",
                    "containerImage": "registry.io/helm-chart-2@sha256:helmdigest2",
                    "repository": "registry.io/helm-chart-2",
                    "tags": [
                      "helm-tag-2"
                    ]
                  },
                  {
                    "name": "container-app-3",
                    "containerImage": "registry.io/container-app-3@sha256:containerdigest3",
                    "repository": "registry.io/container-app-3",
                    "tags": [
                      "container-tag-3"
                    ]
                  }
                ]
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/mydata.json" << EOF
              {
              }
              EOF

              # Set up mock for create_container_image to handle the 3 container images
              cat > "$(params.dataDir)/mock_create_container_image.txt" << EOF
              --pyxis-url https://pyxis.preprod.api.redhat.com/ --certified false --tags container-tag-1 --is-latest false --verbose --oras-manifest-fetch * --name registry.io/container-app-1 --media-type * --digest * --architecture-digest * --architecture * --rh-push false --dockerfile *
              --pyxis-url https://pyxis.preprod.api.redhat.com/ --certified false --tags container-tag-2 --is-latest false --verbose --oras-manifest-fetch * --name registry.io/container-app-2 --media-type * --digest * --architecture-digest * --architecture * --rh-push false --dockerfile *
              --pyxis-url https://pyxis.preprod.api.redhat.com/ --certified false --tags container-tag-3 --is-latest false --verbose --oras-manifest-fetch * --name registry.io/container-app-3 --media-type * --digest * --architecture-digest * --architecture * --rh-push false --dockerfile *
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: create-pyxis-image
      params:
        - name: pyxisSecret
          value: test-create-pyxis-image-cert
        - name: server
          value: stage
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot.json
        - name: dataPath
          value: $(context.pipelineRun.uid)/mydata.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: pyxisDataPath
          value: $(tasks.run-task.results.pyxisDataPath)
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: pyxisDataPath
            type: string
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils:a58dc96cb28b54cdef2564a346d43a6d7bd4d656
            script: |
              #!/usr/bin/env bash
              set -eux

              echo "Checking that create_container_image was called 6 times (3 mock templates + 3 actual calls)"
              if [ "$(wc -l < \
                "$(params.dataDir)/mock_create_container_image.txt")" != 6 ]; then
                echo Error: create_container_image was expected to be called 6 times. Actual calls:
                cat "$(params.dataDir)/mock_create_container_image.txt"
                exit 1
              fi

              echo "Checking that cleanup_tags was not called (rhPush=false)"
              if [ -f "$(params.dataDir)/mock_cleanup_tags.txt" ]; then
                echo Error: cleanup_tags was not expected to be called. Actual calls:
                cat "$(params.dataDir)/mock_cleanup_tags.txt"
                exit 1
              fi

              echo "Checking that all container images were processed with correct tags"
              if ! grep -q -- "--tags container-tag-1" "$(params.dataDir)/mock_create_container_image.txt"; then
                echo "Error: container-tag-1 not found in create_container_image calls"
                cat "$(params.dataDir)/mock_create_container_image.txt"
                exit 1
              fi
              if ! grep -q -- "--tags container-tag-2" "$(params.dataDir)/mock_create_container_image.txt"; then
                echo "Error: container-tag-2 not found in create_container_image calls"
                cat "$(params.dataDir)/mock_create_container_image.txt"
                exit 1
              fi
              if ! grep -q -- "--tags container-tag-3" "$(params.dataDir)/mock_create_container_image.txt"; then
                echo "Error: container-tag-3 not found in create_container_image calls"
                cat "$(params.dataDir)/mock_create_container_image.txt"
                exit 1
              fi

              echo "Checking that skopeo was called for all 5 images (5 times total)"
              if [ "$(wc -l < "$(params.dataDir)"/mock_skopeo.txt)" != 5 ]; then
                echo Error: skopeo was expected to be called 5 times. Actual calls:
                cat "$(params.dataDir)/mock_skopeo.txt"
                exit 1
              fi

              echo "Checking that oras was called 10 times (2 per component: dockerfile + manifest fetch)"
              if [ "$(wc -l < "$(params.dataDir)"/mock_oras.txt)" != 10 ]; then
                echo Error: oras was expected to be called 10 times. Actual calls:
                cat "$(params.dataDir)/mock_oras.txt"
                exit 1
              fi

              echo "Checking that only container images are in the final pyxis output"
              PYXIS_FILE="$(params.dataDir)/$(params.pyxisDataPath)"

              # Should have exactly 5 array slots (with nulls for filtered helm charts)
              COMPONENT_COUNT=$(jq '.components | length' "$PYXIS_FILE")
              if [ "$COMPONENT_COUNT" != "5" ]; then
                echo "Error: Expected 5 components array slots in pyxis output, but found $COMPONENT_COUNT"
                echo "Pyxis file content:"
                cat "$PYXIS_FILE"
                exit 1
              fi

              # Verify componentIndex gaps due to filtered helm charts
              # Original: [0:container, 1:helm, 2:container, 3:helm, 4:container]
              # Expected: [0:container, null, 2:container, null, 4:container]

              COMPONENT_0_INDEX=$(jq -r '.components[0].componentIndex' "$PYXIS_FILE")
              COMPONENT_1_VALUE=$(jq -r '.components[1]' "$PYXIS_FILE")
              COMPONENT_2_INDEX=$(jq -r '.components[2].componentIndex' "$PYXIS_FILE")
              COMPONENT_3_VALUE=$(jq -r '.components[3]' "$PYXIS_FILE")
              COMPONENT_4_INDEX=$(jq -r '.components[4].componentIndex' "$PYXIS_FILE")

              if [ "$COMPONENT_0_INDEX" != "0" ]; then
                echo "Error: Expected componentIndex 0 for first component, got $COMPONENT_0_INDEX"
                cat "$PYXIS_FILE"
                exit 1
              fi

              if [ "$COMPONENT_1_VALUE" != "null" ]; then
                echo "Error: Expected null for components[1] (filtered helm chart), got $COMPONENT_1_VALUE"
                cat "$PYXIS_FILE"
                exit 1
              fi

              if [ "$COMPONENT_2_INDEX" != "2" ]; then
                echo "Error: Expected componentIndex 2 for third component, got $COMPONENT_2_INDEX"
                cat "$PYXIS_FILE"
                exit 1
              fi

              if [ "$COMPONENT_3_VALUE" != "null" ]; then
                echo "Error: Expected null for components[3] (filtered helm chart), got $COMPONENT_3_VALUE"
                cat "$PYXIS_FILE"
                exit 1
              fi

              if [ "$COMPONENT_4_INDEX" != "4" ]; then
                echo "Error: Expected componentIndex 4 for fifth component, got $COMPONENT_4_INDEX"
                cat "$PYXIS_FILE"
                exit 1
              fi

              # Verify no helm charts in output (filter out nulls first)
              if jq -e '.components[] | select(. != null) | select(.containerImage | contains("helm-chart"))' "$PYXIS_FILE" > /dev/null; then
                echo "Error: Helm chart should not be present in pyxis output"
                echo "Pyxis file content:"
                cat "$PYXIS_FILE"
                exit 1
              fi

              # Verify all container images are present (filter out nulls first)
              if ! jq -e '.components[] | select(. != null) | select(.containerImage | contains("container-app-1"))' "$PYXIS_FILE" > /dev/null; then
                echo "Error: container-app-1 missing from pyxis output"
                cat "$PYXIS_FILE"
                exit 1
              fi
              if ! jq -e '.components[] | select(. != null) | select(.containerImage | contains("container-app-2"))' "$PYXIS_FILE" > /dev/null; then
                echo "Error: container-app-2 missing from pyxis output"
                cat "$PYXIS_FILE"
                exit 1
              fi
              if ! jq -e '.components[] | select(. != null) | select(.containerImage | contains("container-app-3"))' "$PYXIS_FILE" > /dev/null; then
                echo "Error: container-app-3 missing from pyxis output"
                cat "$PYXIS_FILE"
                exit 1
              fi

              echo "SUCCESS: Helm charts correctly filtered out, componentIndex preserved (sparse array with nulls)"

      runAfter:
        - run-task
